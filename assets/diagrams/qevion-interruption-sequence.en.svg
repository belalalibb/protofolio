<title id="t">QEVION barge-in protocol — what happens when the caller interrupts</title><desc id="d">Timeline of a user interruption: speech onset, barge-in detection, cancel to provider and stop_playout to client, confirmation, and reconciliation that truncates the unheard tail so it never persists as context.</desc>
