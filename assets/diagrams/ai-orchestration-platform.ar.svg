<title id="t">منصة تنسيق الذكاء الاصطناعي — general_ai_core + chat_engine</title><desc id="d">بنية طبقية: نواة خالية من أطر العمل بمنافذ Protocol، طبقة تركيب (FastAPI ووكيل الإدارة)، ارتباطات بنية تحتية خلف قرارات ADR، ومحوّلات مزوّدين مع بوابة بعيدة؛ يعيد chat_engine استخدام النواة كاعتمادية مثبّتة بـ SHA ويقدّم واجهة متوافقة مع OpenAI وبثّ SSE وواجهة ثنائية اللغة.</desc>
