<title id="t">Where the time goes — measured voice turn without a tool call (sandbox, OpenAI Realtime)</title><desc id="d">Breakdown of a no-tool voice turn: 503 ms configured end-of-turn silence, 1.9 ms QEVION commit, 61 ms network to provider, 441 ms provider first audio, 1.1 ms QEVION forward, 0.6 ms WebSocket, 75 ms browser playout. QEVION-owned time is about 3 ms per turn.</desc>
