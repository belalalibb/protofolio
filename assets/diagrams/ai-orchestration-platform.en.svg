<title id="t">AI orchestration platform — general_ai_core + chat_engine</title><desc id="d">Layered modular monolith: framework-free core with Protocol ports, composition layer (FastAPI, admin agent), infrastructure bindings behind ADRs, provider adapters including a remote gateway; chat_engine reuses the core as a SHA-pinned dependency and exposes an OpenAI-compatible API, SSE streaming and a bilingual UI.</desc>
