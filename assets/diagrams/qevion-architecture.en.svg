<title id="t">QEVION voice runtime — architecture</title><desc id="d">Browser audio streams over WebSocket to a FastAPI runtime whose generic Core imports contracts only; providers are swappable through role ports; business truth is decided by deterministic rules, never by the LLM.</desc>
