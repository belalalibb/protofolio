<text x="600" y="325" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" font-weight="500" fill="#9fb0c7" text-anchor="middle">with self._lock:</text>
<text x="600" y="347" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.5" font-weight="500" fill="#9fb0c7" text-anchor="middle">  avail = [r for r in records</text>
<text x="600" y="367" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.5" font-weight="500" fill="#9fb0c7" text-anchor="middle">           if r.id not in done]</text>
<text x="600" y="389" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.5" font-weight="500" fill="#9fb0c7" text-anchor="middle">  return choice(avail) if avail else None</text>
