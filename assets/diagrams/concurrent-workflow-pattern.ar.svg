<text x="210.0" y="140" font-family="'Tajawal', 'Cairo', 'Noto Sans Arabic', 'Segoe UI', Tahoma, sans-serif" font-size="12" font-weight="400" fill="#9fb0c7" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">عدد العمال = الأصغر بين N والسجلات المعلّقة</text>
<text x="210.0" y="158" font-family="'Tajawal', 'Cairo', 'Noto Sans Arabic', 'Segoe UI', Tahoma, sans-serif" font-size="12" font-weight="400" fill="#9fb0c7" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">بدء متدرّج</text>
<rect x="450" y="90" width="300" height="130" rx="12" fill="#121a2b" stroke="#263147" stroke-width="1.2"/>
