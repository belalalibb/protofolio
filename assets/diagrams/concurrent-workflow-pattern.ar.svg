<text x="210.0" y="310" font-family="'Tajawal', 'Cairo', 'Noto Sans Arabic', 'Segoe UI', Tahoma, sans-serif" font-size="11" font-weight="400" fill="#9fb0c7" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">أخذ → تنفيذ → تحقق → إنهاء</text>
