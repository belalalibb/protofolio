<text x="600" y="40" font-family="'Tajawal', 'Cairo', 'Noto Sans Arabic', 'Segoe UI', Tahoma, sans-serif" font-size="19" font-weight="700" fill="#f1f5f9" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">سير عمل متزامن مرن — مخزن آمن للخيوط، تراجع أسي، تسجيل ثنائي المخرج</text>
<rect x="60" y="90" width="300" height="100" rx="12" fill="#121a2b" stroke="#263147" stroke-width="1.2"/>
<rect x="60" y="90" width="300" height="4" rx="2" fill="#22d3ee"/>
