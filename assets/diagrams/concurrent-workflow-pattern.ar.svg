<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="t d" lang="ar">
<title id="t">سير عمل متزامن مرن — مخزن آمن للخيوط، تراجع أسي، تسجيل ثنائي المخرج</title><desc id="d">منفّذ خيوط يشغّل N عاملاً؛ يأخذ كل عامل سجلاً من مخزن محمي بقفل بحيث لا يعالج عاملان السجل نفسه؛ تُعاد السجلات الفاشلة إلى المخزن؛ إعادة المحاولة بتراجع أسي مع عشوائية؛ مسجّل واحد يكتب معالم المشغّل إلى الطرفية وتتبعاً دقيقاً إلى ملف؛ والإشعارات إلى قناة دردشة.</desc>
