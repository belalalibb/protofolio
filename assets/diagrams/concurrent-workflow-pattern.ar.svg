<text x="600.0" y="140" font-family="'Tajawal', 'Cairo', 'Noto Sans Arabic', 'Segoe UI', Tahoma, sans-serif" font-size="11.5" font-weight="400" fill="#9fb0c7" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">threading.Lock() حول الأخذ / الإنهاء</text>
<text x="600.0" y="158" font-family="'Tajawal', 'Cairo', 'Noto Sans Arabic', 'Segoe UI', Tahoma, sans-serif" font-size="11.5" font-weight="400" fill="#9fb0c7" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">كل سجل بيد عامل واحد بالضبط</text>
<text x="600.0" y="176" font-family="'Tajawal', 'Cairo', 'Noto Sans Arabic', 'Segoe UI', Tahoma, sans-serif" font-size="11.5" font-weight="400" fill="#9fb0c7" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">الفاشل → يعود للمخزن ولا يُفقد</text>
<line x1="362" y1="140" x2="448" y2="140" stroke="#22d3ee" stroke-width="1.8" marker-end="url(#m22d3ee)"/>
