<rect x="60" y="614" width="1080" height="50" rx="10" fill="#1a1607" stroke="#fbbf24" stroke-width="1"/>
<text x="600.0" y="644.0" font-family="'Tajawal', 'Cairo', 'Noto Sans Arabic', 'Segoe UI', Tahoma, sans-serif" font-size="12" font-weight="600" fill="#fbbf24" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">النمط معروض بشكل عام. المشروع الأصلي أتمت حجز مواعيد لعملاء؛ التفاصيل الخاصة بالجهة المستهدفة غير منشورة عمداً.</text>
