<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="t d" lang="ar">
<title id="t">SmartCore — متحكم طرفي يعمل أولاً دون إنترنت (معمارية حسب التقرير)</title><desc id="d">برمجية ESP32 تنفّذ حلقات تحكم محلية وجدول سجلات Modbus RTU؛ تتصل الحساسات والمشغّلات عبر RS-485 وGPIO؛ مهمة خلفية تعكس الحالة إلى Firebase عند توفر الاتصال؛ لوحة ويب تقرأ المرآة. السحابة مرآة سلبية وليست في مسار التحكم.</desc>
